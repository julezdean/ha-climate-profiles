# Profiles are server side, so they work everywhere - not just in the card.

# --- apply a profile on a schedule -------------------------------------------
- alias: Quiet at night
  triggers:
    - trigger: time
      at: "22:30:00"
  actions:
    - action: climate_profiles.apply_profile
      target:
        entity_id: sensor.living_room_climate_profile
      data:
        profile: Night

# --- react to the active profile ---------------------------------------------
# Match on the attribute, not on the state: the state is the display name and
# changes when you rename a profile, the id never does.
- alias: Tell me when it was changed by hand
  triggers:
    - trigger: state
      entity_id: sensor.living_room_climate_profile
      attribute: active_profile_id
      to: "__custom__"
      for: "00:30:00"
  actions:
    - action: notify.mobile_app
      data:
        message: The air conditioner has been on its own values for half an hour.

# --- change a single value ---------------------------------------------------
- alias: A little warmer once nobody is home
  triggers:
    - trigger: state
      entity_id: person.someone
      to: not_home
  actions:
    - action: climate_profiles.set_value
      target:
        entity_id: sensor.living_room_climate_profile
      data:
        temperature: 26

# --- the select entity, e.g. for voice assistants ----------------------------
- alias: Climate to Comfort
  triggers:
    - trigger: event
      event_type: my_voice_command
  actions:
    - action: select.select_option
      target:
        entity_id: select.living_room_profile
      data:
        option: Comfort

# --- hold a profile for the night -------------------------------------------
# A change made by hand goes into the active profile on its own. Write
# protection keeps it out - here only at night, through the profile's switch.
- alias: Protect the night profile at night
  triggers:
    - trigger: time
      at: "22:00:00"
      id: evening
    - trigger: time
      at: "06:00:00"
      id: morning
  actions:
    - action: "switch.turn_{{ 'on' if trigger.id == 'evening' else 'off' }}"
      target:
        entity_id: switch.living_room_night_write_protected

# --- keep a deviation in another profile --------------------------------------
# Changes land in the profile that was active. When the state has drifted to
# custom and stayed there, this stores it into a profile you name instead -
# capture_profile always names its profile, and refuses a protected one.
- alias: Save a deviation into the night profile after an hour
  triggers:
    - trigger: state
      entity_id: sensor.living_room_climate_profile
      attribute: active_profile_id
      to: "__custom__"
      for: "01:00:00"
  conditions:
    - condition: time
      after: "22:00:00"
      before: "06:00:00"
  actions:
    - action: climate_profiles.capture_profile
      target:
        entity_id: sensor.living_room_climate_profile
      data:
        profile: Night
        values:
          - temperature

# --- save the current state as a new profile ---------------------------------
- alias: Save the current state
  triggers:
    - trigger: event
      event_type: my_button_pressed
  actions:
    - action: climate_profiles.save_as_profile
      target:
        entity_id: sensor.living_room_climate_profile
      data:
        name: "Saved {{ now().strftime('%d.%m. %H:%M') }}"
        color: "#f59e0b"

# --- automatic mode -----------------------------------------------------------
# Which profile the sensor of automatic mode names is decided there, not here:
# a template sensor like this one, set under Configure -> Automatic mode.
# (It belongs in configuration.yaml or a package, not in automations.yaml.)
#
# template:
#   - sensor:
#       - name: Bathroom wanted profile
#         state: >
#           {% if is_state('binary_sensor.bathroom_window', 'on') %} Ventilate
#           {% elif is_state('binary_sensor.anyone_home', 'off') %} Away
#           {% else %} Comfort {% endif %}

# --- start a temporary profile from a button ----------------------------------
# While automatic mode is on, only temporary profiles can be started by hand.
# "Boost" runs for its own duration; `duration` overrides it for this call.
- alias: Boost the bathroom before a shower
  triggers:
    - trigger: event
      event_type: my_shower_button_pressed
  actions:
    - action: climate_profiles.apply_profile
      target:
        entity_id: sensor.bathroom_climate_profile
      data:
        profile: Boost
        duration: 30

# --- end it early --------------------------------------------------------------
# The sensor does not end a temporary profile - naming "Ventilate" meanwhile
# only changes what comes next. To let an open window win right away, end it;
# without one running, end_temporary does nothing.
- alias: End the boost when the window opens
  triggers:
    - trigger: state
      entity_id: binary_sensor.bathroom_window
      to: "on"
  actions:
    - action: climate_profiles.end_temporary
      target:
        entity_id: sensor.bathroom_climate_profile
