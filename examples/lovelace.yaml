# Lovelace examples for the Climate Profile Card.
# The card is registered automatically - no resource entry needed.

# --- minimal: everything comes from the integration -------------------------
type: custom:climate-profile-card
entity: sensor.living_room_climate_profile

---
# --- with options -----------------------------------------------------------
type: custom:climate-profile-card
entity: sensor.living_room_climate_profile
name: Living room           # overrides the entity's friendly name
profile_layout: grid        # grid | scroll | dropdown | icons
temperature_style: bar      # bar | dial
show_protection: false      # a lock for the active profile's write protection
show_automatic: false       # a button that switches automatic mode
show_target: true           # what automatic mode aims for - needs a profile sensor
# Everything is shown unless it is hidden. The list mixes the four climate
# keys with the ids of your additional values - the editor writes it for you.
hide: []

---
# --- a compact card: profiles and temperature only ---------------------------
type: custom:climate-profile-card
entity: sensor.bedroom_climate_profile
hide: [hvac_mode, fan_mode, swing_mode]

---
# --- one card among many: profiles as a dropdown ----------------------------
type: custom:climate-profile-card
entity: sensor.hallway_climate_profile
profile_layout: dropdown

---
# --- the shortest form: one button per profile, icon only -------------------
type: custom:climate-profile-card
entity: sensor.bedroom_climate_profile
profile_layout: icons

---
# --- the thermostat shape: a dial, with the step buttons in its gap ----------
type: custom:climate-profile-card
entity: sensor.bedroom_climate_profile
temperature_style: dial

---
# --- several devices next to each other --------------------------------------
type: grid
columns: 2
square: false
cards:
  - type: custom:climate-profile-card
    entity: sensor.living_room_climate_profile
  - type: custom:climate-profile-card
    entity: sensor.bedroom_climate_profile

---
# --- without the custom card: the select entity works on its own -------------
type: entities
entities:
  - entity: select.living_room_profile
  - entity: sensor.living_room_climate_profile
