# Lovelace examples for the Climate Profile Card.
# The card is registered automatically - no resource entry needed.

# --- minimal: everything comes from the integration -------------------------
type: custom:climate-profile-card
entity: sensor.living_room_climate_profile

---
# --- with options -----------------------------------------------------------
type: custom:climate-profile-card
entity: sensor.living_room_climate_profile
name: Living room           # overrides the entity's friendly name
profile_layout: auto        # auto | grid | scroll
show_temperature: true
show_hvac: true
show_fan_mode: true
show_swing: true
show_fan: true
show_display: true
show_silent: true

---
# --- a compact card: profiles and temperature only ---------------------------
type: custom:climate-profile-card
entity: sensor.bedroom_climate_profile
show_hvac: false
show_fan_mode: false
show_swing: false
show_fan: false
show_display: false
show_silent: false

---
# --- several devices next to each other --------------------------------------
type: grid
columns: 2
square: false
cards:
  - type: custom:climate-profile-card
    entity: sensor.living_room_climate_profile
  - type: custom:climate-profile-card
    entity: sensor.bedroom_climate_profile

---
# --- without the custom card: the select entity works on its own -------------
type: entities
entities:
  - entity: select.living_room_profile
  - entity: sensor.living_room_climate_profile
