name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    name: Attach the HACS archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Fail if the manifest version does not match the tag
        run: |
          tag="${{ github.event.release.tag_name }}"
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/climate_profiles/manifest.json'))['version'])")
          if [ "$tag" != "v$manifest" ]; then
            echo "::error::tag $tag does not match manifest version $manifest"
            exit 1
          fi

      # HACS installs the archive contents into custom_components/climate_profiles,
      # so the archive holds that directory's contents - the card under frontend/
      # and the brand images under brand/ included.
      - name: Build climate_profiles.zip
        run: |
          cd custom_components/climate_profiles
          zip -r "$GITHUB_WORKSPACE/climate_profiles.zip" . \
            -x "__pycache__/*" "*/__pycache__/*" "*.pyc" ".DS_Store" "*/.DS_Store"
          unzip -l "$GITHUB_WORKSPACE/climate_profiles.zip"

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            climate_profiles.zip --clobber
