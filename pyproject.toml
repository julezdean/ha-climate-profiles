[project]
name = "climate-profiles"
version = "2.0.0-beta.2"
description = "Home Assistant integration that turns any climate entity into freely configurable profiles"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D", "RUF"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]
"tools/*" = ["D100", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
